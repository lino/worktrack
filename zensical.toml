[project]
site_url = "https://lino.github.io/worktrack/"
site_name = "Worktrack (wt) Documentation"
site_description = "Anti-surveillance personal time ledger, Outbox rollup gateway, and planning cockpit."
site_author = "Worktrack Contributors"

nav = [
  { "Overview" = "index.md" },
  { "User Guide" = [
    { "Quickstart & Tracking Time" = "user/guide.md" },
    { "Planning, Focus Time & Reconciling" = "user/planning-and-reconciliation.md" },
    { "Jira Cloud Login, Sync & Outbox" = "user/jira-and-outbox.md" },
    { "Calendars, Work Location & Reports" = "user/calendars-and-reports.md" },
    { "MCP Server for AI Assistants" = "user/mcp-server.md" },
    { "Web Cockpit, Shell Prompts & Team Hub" = "user/cockpit-and-integrations.md" },
  ] },
  { "Developer & Self-Hosting" = [
    { "Architecture & Contributing" = "developer/guide.md" },
    { "Metrics Host, Health Checks & Docker" = "developer/metrics-and-monitoring.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
