[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "worktrack"
version = "0.1.0"
description = "Low-key, anti-surveillance personal time ledger and planning cockpit."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Worktrack Contributors" }]
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15.0",
    "drf-spectacular>=0.28.0",
    "prometheus-client>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/lino/worktrack"
Documentation = "https://lino.github.io/worktrack/"
Repository = "https://github.com/lino/worktrack.git"
Issues = "https://github.com/lino/worktrack/issues"

[project.scripts]
wt = "worktrack.cli:main"

[project.optional-dependencies]
aws = [
    "boto3>=1.35.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-benchmark>=5.1.0",
    "pytest-django>=4.9.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/worktrack"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "C90",
    "D",
    "PLR0915",
    "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "django.*",
    "rest_framework.*",
    "drf_spectacular.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]
