name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test & Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise toolchain
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Install Zsh for shell plugin verification
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh

      - name: Install locked Python and frontend dependencies
        run: |
          uv sync --locked --dev
          pnpm -C frontend install --frozen-lockfile

      - name: Run Ruff style and Google docstring checks
        run: uv run ruff check .

      - name: Run strict static type analysis
        run: uv run mypy --strict src tests

      - name: Verify OpenAPI 3.1 schema determinism
        run: uv run python -m worktrack.web.schema_export --check

      - name: Run frontend craft hygiene and TypeScript checks
        run: |
          pnpm -C frontend run lint
          pnpm -C frontend run typecheck

      - name: Run behavioural Python and frontend test suites
        run: |
          uv run pytest
          pnpm -C frontend run test

      - name: Build strict Zensical User and Operations manuals
        run: uvx zensical build --strict

      - name: Verify multi-stage Docker runtime build
        run: docker build --file Dockerfile --tag worktrack:ci .
