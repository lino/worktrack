name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test & Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise toolchain
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run Ruff style and Google docstring checks
        run: uv run ruff check .

      - name: Run strict static type analysis
        run: uv run mypy --strict src tests

      - name: Run behavioural test and AST hygiene suite
        run: uv run pytest

      - name: Build strict Zensical User and Operations manuals
        run: uvx zensical build --strict

      - name: Verify multi-stage Docker runtime build
        run: docker build --file Dockerfile --tag worktrack:ci .
